apiVersion: batch/v1
kind: Job
metadata:
  name: hello-job
spec:
  ttlSecondsAfterFinished: 60
  completions: 2
  parallelism: 2
  backoffLimit: 4 #recreat the pod retry 4 times and if it doresntwork 
  template:
    spec:
      containers:
        - name: hello
          image: busybox
          command: ["bin/sh", "-c", "echo Hello from the Job! && sleep 10"]
      restartPolicy: Never  # if the container fails here we are recontrolling the container 
